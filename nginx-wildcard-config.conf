# Nginx Configuration for MyAkad Wildcard Subdomain
# Location: C:\laragon\etc\nginx\sites-enabled\myakad.test.conf

server {
    listen 80;
    listen [::]:80;
    
    # Wildcard subdomain support
    server_name myakad.test *.myakad.test;
    
    root C:/laragon/www/myakad/public;
    index index.php index.html index.htm;
    
    # Charset
    charset utf-8;
    
    # Logs
    access_log C:/laragon/www/myakad/storage/logs/nginx-access.log;
    error_log C:/laragon/www/myakad/storage/logs/nginx-error.log;
    
    # Laravel routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    
    # PHP-FPM configuration
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        
        # Increase timeout for long requests
        fastcgi_read_timeout 300;
    }
    
    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Deny access to sensitive files
    location ~ /\.(?!well-known).* {
        deny all;
    }
    
    # Static files caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
