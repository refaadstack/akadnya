# MyAkad Virtual Host Configuration
# Copy file ini ke: C:\Program Files\FlyEnv-Data\app\apache-2.4.67\Apache24\conf\extra\httpd-myakad.conf
# Lalu tambahkan di httpd.conf: Include conf/extra/httpd-myakad.conf
# Restart Apache setelah itu

<VirtualHost *:80>
    ServerName myakad.test
    ServerAlias www.myakad.test
    DocumentRoot "D:/myakad/public"
    
    <Directory "D:/myakad/public">
        Options +Indexes +FollowSymLinks +SymLinksIfOwnerMatch
        AllowOverride All
        Require all granted
    </Directory>
    
    # Enable symlink support for storage directory
    <Directory "D:/myakad/public/storage">
        Options +FollowSymLinks +SymLinksIfOwnerMatch
        AllowOverride None
        Require all granted
    </Directory>
    
    ErrorLog "logs/myakad-error.log"
    CustomLog "logs/myakad-access.log" common
</VirtualHost>
