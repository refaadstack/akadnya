name: Update WSL

on:
  push:
    branches:
      - master

jobs:
  update-wsl:
    runs-on: [self-hosted, linux, x64]

    concurrency:
      group: update-wsl-myakad
      cancel-in-progress: true

    steps:
      - name: Update local WSL checkout
        run: |
          set -euo pipefail
          cd /home/refaad/projects/myakad
          git fetch origin master
          git reset --hard origin/master
