services:
  app:
    image: myakad:latest
    container_name: myakad-app
    build:
      context: .
    ports:
      - "8081:8080"
    env_file:
      - .env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8081
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: myakad
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:-SB-Mid-server-avYbbijOCiUpuBiB32snZg9R}
      MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY:-SB-Mid-client-Kw3o7zBIgNS3Ftk1}
      MIDTRANS_IS_PRODUCTION: "false"
      MIDTRANS_IS_SANITIZED: "true"
      MIDTRANS_IS_3DS: "true"
    volumes:
      - ./storage/app/public:/app/storage/app/public
      - ./storage/logs:/app/storage/logs
    networks:
      - infra_default

networks:
  infra_default:
    external: true
