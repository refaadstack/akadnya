services:
  app:
    image: myakad:latest
    container_name: myakad-app
    build:
      context: .
    ports:
      - "8081:8080"
    env_file:
      - .env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: https://myakad.refaadstack.com
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: myakad
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      PAYMENT_SERVICE_URL: http://payment-service-app:8080
      PAYMENT_SERVICE_PUBLIC_URL: https://pay.refaadstack.com
      MYAKAD_PRODUCT_KEY: ${MYAKAD_PRODUCT_KEY}
      MYAKAD_CALLBACK_SECRET: ${MYAKAD_CALLBACK_SECRET}
    volumes:
      - ./storage/app/public:/app/storage/app/public
      - ./storage/logs:/app/storage/logs
    networks:
      - infra_default

networks:
  infra_default:
    external: true
